<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07151f" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link
      rel="preload"
      href="/src/assets/fonts/audiowide-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/poppins-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="description"
      content="Natnael Fikreyesus — logo and brand identity designer helping businesses stand out with memorable visual identities."
    />
    <title>Natnael F. Portfolio — Logo &amp; Brand Identity Designer</title>
    <!-- theme-init -->
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f5fcfd;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 300ms ease,
          visibility 300ms ease;
      }

      html[data-theme='dark'] #initial-loader {
        background: #07151f;
      }

      #initial-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #loader-animation {
        width: clamp(16rem, 24vw, 30rem);
        aspect-ratio: 1;
      }

      #loader-animation svg {
        display: block;
        width: 100%;
        height: 100%;
        transform: scale(2);
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div id="loader-animation"></div>
    </div>

    <div id="root"></div>

    <script type="module">
      import lottie from 'lottie-web';
      import logoDark from './src/assets/animations/logo-dark.json';
      import logoLight from './src/assets/animations/logo-light.json';

      const theme = document.documentElement.dataset.theme;

      lottie.loadAnimation({
        container: document.getElementById('loader-animation'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        animationData: theme === 'dark' ? logoDark : logoLight,
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
